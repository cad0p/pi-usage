name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      # Zero runtime and dev dependencies: there is nothing to install.
      - run: npm test
      - name: Package contents
        run: npm pack --dry-run --json | node -e 'const f=JSON.parse(require("fs").readFileSync(0,"utf8"))[0].files.map(x=>x.path); for (const need of ["bin/piquota.js","extensions/quota-panel.ts","omarchy/cad0p.pi-usage/manifest.json","omarchy/cad0p.pi-usage/Panel.qml","omarchy/cad0p.pi-usage/UsageLogic.js","README.md","LICENSE"]) if (!f.includes(need)) { console.error("missing from tarball:", need); process.exit(1); }'
